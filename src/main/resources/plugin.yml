name: ZeroCkate_SFServerPlugin
version: '${version}'

main: server.sf.model.api.v1.main
api-version: '1.21.5'
load: POSTWORLD
softdepend: [Vault, Essentials, EssentialsX]

commands:
  servermanagement:
    description: r
    usage: /servermanagement reload
    aliases: [sm, svm]
    permission: servermanagement.use
  ty:
    description: r
    usage: /ty <YiJian>
  ru:
    description: r
    usage: /ru
  sh:
    description: r
    usage: /sh
  giveit:
    description: r
    usage: /giveit

  spawn:
    description: 传送到出生点
    usage: /spawn [set]
    aliases: [spawnpoint]
  setspawn:
    description: 设置出生点
    usage: /setspawn
    permission: sf.spawn.set
  home:
    description: 传送到家
    usage: /home [名称]
  sethome:
    description: 设置家
    usage: /sethome [名称]
  delhome:
    description: 删除家
    usage: /delhome <名称>
  homes:
    description: 列出所有家
    usage: /homes
  warp:
    description: 传送到公共传送点
    usage: /warp [名称]
  setwarp:
    description: 设置公共传送点
    usage: /setwarp <名称>
    permission: sf.warp.set
  delwarp:
    description: 删除公共传送点
    usage: /delwarp <名称>
    permission: sf.warp.set
  warps:
    description: 列出所有公共传送点
    usage: /warps
  back:
    description: 返回上次位置
    usage: /back
    aliases: [return]
  tp:
    description: 管理员传送
    usage: /tp <玩家> [目标] | /tp <x> <y> <z>
    permission: sf.admin.tp
  tphere:
    description: 召唤玩家到你身边
    usage: /tphere <玩家>
    permission: sf.admin.tp
  tpa:
    description: 请求传送到玩家身边
    usage: /tpa <玩家>
  tpahere:
    description: 请求玩家传送到你身边
    usage: /tpahere <玩家>
  tpaccept:
    description: 接受传送请求
    usage: /tpaccept
  tpdeny:
    description: 拒绝传送请求
    usage: /tpdeny
  tpcancel:
    description: 取消传送请求
    usage: /tpcancel

  gm:
    description: 切换游戏模式
    usage: /gm <模式> [玩家]
    aliases: [gamemode]
    permission: sf.admin.gamemode
  fly:
    description: 切换飞行
    usage: /fly [玩家]
    permission: sf.admin.fly
  heal:
    description: 治疗
    usage: /heal [玩家]
    permission: sf.admin.heal
  feed:
    description: 喂饱
    usage: /feed [玩家]
    permission: sf.admin.feed
  god:
    description: 切换无敌
    usage: /god [玩家]
    permission: sf.admin.god
  vanish:
    description: 切换隐身
    usage: /vanish [玩家]
    permission: sf.admin.vanish
  ec:
    description: 打开末影箱
    usage: /ec [玩家]
    aliases: [enderchest]
    permission: sf.admin.enderchest
  wb:
    description: 打开工作台
    usage: /wb
    aliases: [workbench, craft]
    permission: sf.admin.workbench
  clear:
    description: 清空背包
    usage: /clear [玩家]
    aliases: [clearinv]
    permission: sf.admin.clear
  speed:
    description: 设置速度
    usage: /speed <1-10> [玩家]
    permission: sf.admin.speed
  suicide:
    description: 自杀
    usage: /suicide
    aliases: [killme]
  sfenchant:
    description: SF 附魔系统
    usage: /sfenchant <list|apply|book|remove|info|help>
    aliases: [sfe, sfen]
    permission: sf.admin.enchant
  sfitem:
    description: SF 物品系统
    usage: /sfitem <list|give|info|hand|reload|help>
    aliases: [sfi]
    permission: sf.admin.item
  sfchat:
    description: SF 聊天系统
    usage: /sfchat <channel|mute|unmute|muteinfo|block|unblock|blocklist|clear|help>
    aliases: [sfc]
  sfworld:
    description: SF 世界管理
    usage: /sfworld <time|day|night|weather|difficulty|pvp|border|mob|fire|preset|info|list|help>
    aliases: [sfw]
    permission: sf.admin.world
  sfperm:
    description: SF 权限系统
    usage: /sfperm <group|set|addperm|rmperm|info|list|help>
    aliases: [sfp]
    permission: sf.admin.permission
  sfreach:
    description: SF 交互距离
    usage: /sfreach <info|set|add|reset|help>
    aliases: [sfre]

permissions:
  servermanagement.use:
    description: r
    default: op
  servermanagement.reload:
    description: r
    default: op
  sf.spawn.set:
    description: 设置出生点
    default: op
  sf.warp.set:
    description: 设置/删除公共传送点
    default: op
  sf.teleport.bypass:
    description: 跳过传送冷却
    default: op
  sf.admin.tp:
    description: 管理员传送
    default: op
  sf.admin.enchant:
    description: SF 附魔系统
    default: op
  sf.admin.item:
    description: SF 物品系统
    default: op
  sf.admin.gamemode:
    description: 切换游戏模式
    default: op
  sf.admin.fly:
    description: 切换飞行
    default: op
  sf.admin.heal:
    description: 治疗
    default: op
  sf.admin.feed:
    description: 喂饱
    default: op
  sf.admin.god:
    description: 无敌模式
    default: op
  sf.admin.vanish:
    description: 隐身
    default: op
  sf.admin.seevanished:
    description: 看到隐身玩家
    default: op
  sf.admin.enderchest:
    description: 打开末影箱
    default: op
  sf.admin.workbench:
    description: 打开工作台
    default: op
  sf.admin.clear:
    description: 清空背包
    default: op
  sf.admin.speed:
    description: 设置速度
    default: op
  sf.admin.world:
    description: 世界管理
    default: op
  sf.admin.chat:
    description: 聊天管理
    default: op
  sf.admin.permission:
    description: 权限管理
    default: op
  sf.admin.reach:
    description: 交互距离管理
    default: op
